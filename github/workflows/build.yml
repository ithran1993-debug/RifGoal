name: Build Rif Goal APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Check Flutter project
        run: |
          test -f pubspec.yaml
          test -f lib/main.dart

      - name: Generate Android files
        run: flutter create --platforms=android --project-name rifgoal .

      - name: Verify Android files
        run: |
          test -f android/app/build.gradle
          test -f android/gradlew

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RifGoal-APK
          path: build/app/outputs/flutter-apk/app-release.apk
